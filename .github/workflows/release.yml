name: Release Setup Script

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DeviceFarm-Agent-Setup.bat
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }} - Setup Script
          body: |
            Download **DeviceFarm-Agent-Setup.bat** and run it to install the DeviceFarm Agent.
            
            The setup script will:
            - Install Git, Node.js, and ADB if missing
            - Clone/update the agent repository
            - Install all dependencies
            - Launch the agent
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

